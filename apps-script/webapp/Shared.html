<style>
:root {
  --color-bg: #f6f6f6;
  --color-surface: #ffffff;
  --color-navy: #c9121d;
  --color-navy-light: #ee3038;
  --color-gold: #e6202a;
  --color-gold-light: #ffe9ea;
  --color-text: #242424;
  --color-text-muted: #6e6e6e;
  --color-border: #e4e4e4;
  --color-danger: #d71a24;
  --radius: 12px;
  --shadow: 0 3px 14px rgba(0, 0, 0, .08);
  --shadow-hover: 0 8px 24px rgba(0, 0, 0, .14);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }

.container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---------- Top nav ---------- */
.topnav {
  background: linear-gradient(90deg, #c70d19 0%, #ed252d 52%, #c70d19 100%);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow);
  border-bottom: 1px solid rgba(255,255,255,.35);
}
.topnav .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-weight: 700;
  font-size: 17px;
  color: #fff;
}
.game-logo { width: 55px; height: 34px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.32)); align-self: center; }
.brand .brand-sub {
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,.82);
  border-left: 1px solid rgba(255,255,255,.55);
  padding-left: 9px;
}
.nav-links {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.nav-links a {
  color: rgba(255,255,255,.88);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: background .15s, color .15s;
}
.nav-links a:hover { background: rgba(255,255,255,.17); color: #fff; }
.nav-links a.active { background: #fff; color: #c9121d; box-shadow: 0 2px 10px rgba(0,0,0,.16); }

.nav-links a[data-tooltip] { position: relative; }
.nav-links a[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(-4px);
  background: #3b3b3b;
  color: #fff;
  font-size: 12.5px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .15s ease, transform .15s ease;
  z-index: 60;
}
.nav-links a[data-tooltip]:hover::after {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

/* ---------- Hero ---------- */
.hero {
  background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.22), transparent 23%), linear-gradient(135deg, #cb101b 0%, #f13a42 54%, #b90b16 100%);
  color: #fff;
  padding: 56px 0 72px;
}
.hero h1 {
  font-size: 30px;
  margin: 0 0 12px;
}
.hero p {
  color: rgba(255,255,255,.92);
  max-width: 640px;
  font-size: 15px;
  margin: 0 0 28px;
}
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .1s, box-shadow .15s, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: #e6202a; color: #fff; box-shadow: 0 3px 10px rgba(190,10,20,.25); }
.btn-primary:hover { background: #c9121d; }
.btn-ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.75); }
.btn-ghost:hover { background: rgba(255,255,255,.18); }
.btn-outline { background: transparent; color: #c9121d; border: 1px solid #d6d6d6; }
.btn-outline:hover { border-color: #e6202a; }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ---------- Stat cards ---------- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-top: -44px;
  margin-bottom: 36px;
}
.stat-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--color-navy); }
.stat-card .label { font-size: 13px; color: var(--color-text-muted); margin-top: 4px; }

/* ---------- Section entry cards ---------- */
.section-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 48px;
}
.entry-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  border-top: 4px solid var(--color-gold);
  transition: box-shadow .15s, transform .15s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.entry-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.entry-card h3 { margin: 0; font-size: 18px; }
.entry-card p { margin: 0; color: #666; font-size: 14px; }
.entry-card .go { margin-top: 8px; color: var(--color-navy); font-weight: 600; font-size: 14px; }

.page-header { padding: 40px 0 24px; }
.page-header h1 { margin: 0 0 8px; font-size: 26px; color: var(--color-navy); }
.page-header p { margin: 0; color: #666; font-size: 14px; }

/* ---------- Filter bar ---------- */
.filter-bar {
  background: var(--color-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filter-row .filter-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-muted);
  width: 88px;
  flex-shrink: 0;
}
.search-input {
  flex: 1;
  min-width: 220px;
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  font-size: 14px;
  background: #fff;
  color: var(--color-text);
}
.search-input:focus { outline: none; border-color: var(--color-gold); box-shadow: 0 0 0 3px rgba(230,32,42,.1); }

.chip {
  display: inline-flex;
  align-items: center;
  padding: 5px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--color-border);
  background: #fff;
  color: #666;
  cursor: pointer;
  user-select: none;
  transition: all .12s;
}
.chip:hover { border-color: var(--color-gold); color: var(--color-text); }
.chip.active { background: #e6202a; border-color: #e6202a; color: #fff; }
.chip.tag-readonly { cursor: default; }
.chip.tag-readonly:hover { border-color: var(--color-border); color: var(--color-text-muted); }

/* tag color variants for readonly display */
.tag-purpose { background: #fff0f1; color: #c9121d; border-color: #ffc7ca; }
.tag-special { background: #fff4e4; color: #a95d08; border-color: #f5d19c; }
.tag-mechanism { background: #edf7f0; color: #28723a; border-color: #cce7d3; }
.tag-todo { background: #fff0f1; color: #c9121d; border-color: #ffc7ca; }
.tag-goal { background: #fff0f1; color: #c9121d; border-color: #ffc7ca; }

/* ---------- Metric tiers ---------- */
.metric-high { background: #eef8f1; color: #27783b; border-color: #c9e6d1; }
.metric-mid { background: #fff4e4; color: #a95d08; border-color: #f5d19c; }
.metric-low { background: #fff0f1; color: #c9121d; border-color: #ffc7ca; }

.metric-stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
.metric-stat { flex: 1; min-width: 130px; border-radius: 10px; padding: 14px 16px; border: 1px solid; }
.metric-stat .metric-num { font-size: 24px; font-weight: 700; line-height: 1.2; }
.metric-stat .metric-tier-label { font-size: 12px; font-weight: 600; margin-top: 4px; }

/* ---------- Goal option cards（我要找活動靈感） ---------- */
.goal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.goal-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 2px solid transparent;
  padding: 26px 20px;
  text-align: center;
  cursor: pointer;
  transition: box-shadow .15s, transform .15s, border-color .15s;
}
.goal-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.goal-card.active { border-color: var(--color-gold); background: #fff7f7; box-shadow: 0 0 0 1px rgba(230,32,42,.12), var(--shadow-hover); }
.goal-card .icon { font-size: 30px; margin-bottom: 10px; }
.goal-card .label { font-size: 15px; font-weight: 700; color: var(--color-navy); }
.goal-card .count { margin-top: 6px; font-size: 12.5px; color: var(--color-text-muted); }

/* ---------- Photos ---------- */
.card-photo { height: 130px; border-radius: 8px; overflow: hidden; background: #eef0f5; }
.card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo.photo-placeholder {
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--color-border);
  background: #fafafa;
  color: var(--color-text-muted);
  font-size: 13px;
}
.card-photo.img-error img { display: none; }
.photo-box {
  background: #fafafa;
  border: 1px dashed var(--color-border);
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--color-text-muted);
  font-size: 13.5px;
}
.photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.photo-gallery-item { display: block; height: 90px; border-radius: 8px; overflow: hidden; background: #eef0f5; }
.photo-gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

.attachment-list { display: flex; flex-direction: column; gap: 8px; }
.attachment-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #c9121d;
  font-size: 13.5px;
  font-weight: 600;
  padding: 9px 14px;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  width: fit-content;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.attachment-link:hover { border-color: var(--color-gold); }

.demo-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  font-size: 13.5px;
  font-weight: 700;
  padding: 10px 16px;
  background: #e6202a;
  border: 1px solid #e6202a;
  border-radius: 8px;
  width: fit-content;
}
.demo-link:hover { background: #c9121d; }
.demo-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #c9121d; }

/* ---------- Card grid ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding-bottom: 60px; }
.item-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  cursor: pointer;
  transition: box-shadow .15s, transform .15s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.item-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.item-card .title { font-size: 16px; font-weight: 700; color: var(--color-navy); }
.item-card .meta { font-size: 12.5px; color: var(--color-text-muted); }
.item-card .desc {
  font-size: 13.5px;
  color: var(--color-text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.item-card .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.item-card .footer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px solid var(--color-border);
  font-size: 12.5px;
  color: var(--color-text-muted);
}
.author-badge { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #3a3a3a; }
.avatar-circle {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--color-gold);
  color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.empty-state { text-align: center; padding: 60px 20px; color: var(--color-text-muted); }
.empty-state .big { font-size: 40px; margin-bottom: 8px; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(22,34,63,0.55);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #fff;
  border-radius: var(--radius);
  max-width: 640px;
  width: 100%;
  padding: 28px 30px 30px;
  position: relative;
  box-shadow: var(--shadow-hover);
}
.modal-close { position: absolute; top: 18px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-text-muted); }
.modal-box h2 { margin: 0 0 4px; color: var(--color-navy); font-size: 20px; }
.modal-sub { color: var(--color-text-muted); font-size: 13px; margin-bottom: 20px; }

.detail-section { margin-bottom: 16px; }
.detail-section .label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
.detail-section .value { font-size: 14.5px; white-space: pre-line; }
.metrics-box {
  background: #fff0f1;
  border: 1px dashed #ffc7ca;
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--color-danger);
  font-size: 13.5px;
}

/* ---------- Form ---------- */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--color-text); }
.form-group .hint { font-weight: 400; color: var(--color-text-muted); font-size: 12px; }
.form-group input[type="text"], .form-group textarea, .form-group select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--color-text);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: var(--color-gold); box-shadow: 0 0 0 3px rgba(230,32,42,.1);
}
.chip-select-group { display: flex; flex-wrap: wrap; gap: 8px; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.form-banner { background: #fff0f1; color: #a60f18; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 18px; }
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #c9121d; color: #fff;
  padding: 12px 22px; border-radius: 8px;
  font-size: 14px; box-shadow: var(--shadow-hover);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }

footer.site-footer { text-align: center; color: var(--color-text-muted); font-size: 12.5px; padding: 30px 0 40px; }

@media (max-width: 900px) {
  .topnav .container { height: auto; min-height: 64px; padding-top: 8px; padding-bottom: 8px; align-items: flex-start; }
  .brand { padding-top: 8px; }
  .nav-links { flex-wrap: wrap; justify-content: flex-end; }
  .nav-links a { padding: 6px 10px; }
}
@media (max-width: 640px) {
  .topnav .container { flex-direction: column; }
  .nav-links { justify-content: flex-start; }
  .brand .brand-sub { display: none; }
  .game-logo { width: 45px; height: 30px; }
}
</style>

<script>
// 全站共用的標籤定義與 UI 輔助函式

// 「過往歷史活動」用的設計目的／特殊需求／遊戲類型分類
const PURPOSE_TAGS = ['拉新', '回流', '留存', '付費', '版本導流', '品牌口碑'];

const SPECIAL_TAG_SUGGESTIONS = [
  '時事熱點', '節慶檔期', 'IP聯動', '週年慶', '新版本上市',
  '電競賽事聯動', '老玩家回歸', '低開發成本', '需搭配抽卡機制',
];

const MECHANISM_TAGS = [
  '益智消除', '反應操作', '心理測驗', '經營模擬', '任務養成',
  '抽獎機率', '社交邀請', '陣營競賽', '劇情回顧', '音樂節奏', '其他',
];

// 「我要找活動靈感」頁面的四個目標選項，也是「我有H5活動靈感／我有熱點活動靈感」
// 新增點子表單裡「設計目的」欄位的選項來源，點選後可在「我要找活動靈感」頁面
// 立即看到標註對應目標的點子。
const GOAL_TAGS = [
  { key: '提升主要模式時長', icon: '⚔️' },
  { key: '提升其他模式時長', icon: '🎮' },
  { key: '提升非對局在線時長', icon: '🕒' },
  { key: '提升登入率', icon: '📲' },
];

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function tagChip(text, variant, opts) {
  opts = opts || {};
  const cls = `chip tag-readonly ${variant ? 'tag-' + variant : ''}`;
  return `<span class="${cls}"${opts.title ? ` title="${escapeHtml(opts.title)}"` : ''}>${escapeHtml(text)}</span>`;
}

function tagRow(tags, variant) {
  if (!tags || !tags.length) return '';
  return `<div class="tag-row">${tags.map((t) => tagChip(t, variant)).join('')}</div>`;
}

function purposeTagsOrTodo(tags) {
  if (tags && tags.length) return tagRow(tags, 'purpose');
  return tagChip('設計目的待補充', 'todo');
}

// Google Drive「分享連結」本質上是預覽頁面網址，不是圖片檔案本身，直接當 <img src>
// 用會顯示不出來。這裡在顯示時自動轉成 Google 官方的縮圖端點，不會更動原始連結。
function normalizeImageUrl(url) {
  if (!url) return url;
  const trimmed = String(url).trim();
  if (!trimmed.includes('drive.google.com') || trimmed.includes('/thumbnail')) return trimmed;
  const fileMatch = trimmed.match(/\/file\/d\/([^/]+)/);
  const idParamMatch = trimmed.match(/[?&]id=([^&]+)/);
  const fileId = fileMatch ? fileMatch[1] : idParamMatch ? idParamMatch[1] : null;
  return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000` : trimmed;
}

function demoLinkHtml(demoUrl) {
  if (!demoUrl) return '';
  return `<a href="${escapeHtml(demoUrl)}" target="_blank" rel="noopener" class="demo-link">▶ 開啟 Demo 網頁</a>`;
}

function attachmentListHtml(attachments) {
  if (!attachments || !attachments.length) return '';
  return `<div class="attachment-list">${attachments
    .map((url, i) => `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="attachment-link">📎 附件 ${i + 1}</a>`)
    .join('')}</div>`;
}

function cardPhotoHtml(images) {
  if (images && images.length) {
    return `<div class="card-photo"><img src="${escapeHtml(normalizeImageUrl(images[0]))}" alt="" loading="lazy" onerror="this.closest('.card-photo').classList.add('img-error')"></div>`;
  }
  return `<div class="card-photo photo-placeholder"><span>🖼️ 尚無照片</span></div>`;
}

function photoGalleryHtml(images) {
  if (!images || !images.length) {
    return `<div class="photo-box">🖼️ 照片待補充——之後有活動截圖或素材可以補在這裡。</div>`;
  }
  return `<div class="photo-gallery">${images
    .map((url) => `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="photo-gallery-item"><img src="${escapeHtml(normalizeImageUrl(url))}" alt="" loading="lazy"></a>`)
    .join('')}</div>`;
}

// 成效數據分級門檻
const METRIC_THRESHOLDS = {
  visitRate: { high: 40, mid: 25 },
  completionRate: { high: 30, mid: 15 },
};

function metricTier(value, kind) {
  const t = METRIC_THRESHOLDS[kind];
  if (value >= t.high) return { label: '表現優異', cls: 'metric-high' };
  if (value >= t.mid) return { label: '表現中等', cls: 'metric-mid' };
  return { label: '待加強', cls: 'metric-low' };
}

function metricStatHtml(label, value, kind) {
  const tier = metricTier(value, kind);
  return `
    <div class="metric-stat ${tier.cls}">
      <div class="metric-num">${value}%</div>
      <div class="metric-tier-label">${escapeHtml(label)}・${tier.label}</div>
    </div>
  `;
}

function metricsSectionHtml(metrics) {
  if (!metrics) {
    return `<div class="metrics-box">📊 成效數據待補充——待營運團隊整理完成後會更新此區塊。</div>`;
  }
  if (metrics.visitRate != null || metrics.completionRate != null) {
    const stats = [];
    if (metrics.visitRate != null) stats.push(metricStatHtml('參與率', metrics.visitRate, 'visitRate'));
    if (metrics.completionRate != null) stats.push(metricStatHtml('完成率', metrics.completionRate, 'completionRate'));
    return `<div class="metric-stats-row">${stats.join('')}</div>`;
  }
  return `<div class="value">${escapeHtml(metrics.summary || '')}</div>`;
}

function metricsBadgeHtml(metrics) {
  if (!metrics) return `<span class="chip tag-readonly tag-todo">成效待補充</span>`;
  if (metrics.visitRate != null || metrics.completionRate != null) {
    const parts = [];
    if (metrics.visitRate != null) parts.push(`參與 ${metrics.visitRate}%`);
    if (metrics.completionRate != null) parts.push(`完成 ${metrics.completionRate}%`);
    const kind = metrics.completionRate != null ? 'completionRate' : 'visitRate';
    const value = metrics.completionRate != null ? metrics.completionRate : metrics.visitRate;
    const tier = metricTier(value, kind);
    return `<span class="chip tag-readonly ${tier.cls}">${escapeHtml(parts.join(' · '))}</span>`;
  }
  return `<span class="chip tag-readonly" style="background:#eaf7ee;color:#1e7a3c;border-color:#cdeed6;">已有成效數據</span>`;
}

function initialsOf(name) {
  if (!name) return '?';
  const trimmed = name.trim();
  return trimmed.slice(0, 1).toUpperCase();
}

function formatDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

function debounce(fn, delay) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay || 250);
  };
}

function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function renderChipSelect(container, tags, selected) {
  container.innerHTML = tags
    .map((t) => `<span class="chip" data-value="${escapeHtml(t)}">${escapeHtml(t)}</span>`)
    .join('');
  container.querySelectorAll('.chip').forEach((chip) => {
    if (selected.includes(chip.dataset.value)) chip.classList.add('active');
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
    });
  });
}

function getSelectedChips(container) {
  return [...container.querySelectorAll('.chip.active')].map((c) => c.dataset.value);
}

function renderIdeaDetailModal(idea, opts) {
  opts = opts || {};
  const box = document.getElementById('detailModalBox');
  box.innerHTML = `
    <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    <h2>${escapeHtml(idea.title)}</h2>
    <div class="modal-sub">
      <span class="author-badge"><span class="avatar-circle">${escapeHtml(initialsOf(idea.submittedBy))}</span>${escapeHtml(idea.submittedBy || '匿名')}</span>
      提供 · ${formatDateShort(idea.createdAt)}
    </div>

    <div class="detail-section">
      <div class="label">示意圖／Demo 照片</div>
      ${photoGalleryHtml(idea.images)}
    </div>

    ${idea.demoUrl ? `<div class="detail-section"><div class="label">互動 Demo</div>${demoLinkHtml(idea.demoUrl)}</div>` : ''}

    <div class="detail-section">
      <div class="label">詳細說明</div>
      <div class="value">${escapeHtml(idea.description)}</div>
    </div>

    <div class="detail-section">
      <div class="label">設計目的</div>
      ${purposeTagsOrTodo(idea.purposeTags)}
    </div>

    ${idea.inspirationRef ? `<div class="detail-section"><div class="label">參考／靈感來源</div><div class="value">${escapeHtml(idea.inspirationRef)}</div></div>` : ''}

    ${idea.attachments && idea.attachments.length ? `<div class="detail-section"><div class="label">附件</div>${attachmentListHtml(idea.attachments)}</div>` : ''}

    ${opts.manageActions ? `
    <div class="form-actions" style="justify-content:flex-start;border-top:1px solid var(--color-border);padding-top:16px;">
      <button type="button" class="btn btn-outline btn-sm manage-edit-btn" data-id="${escapeHtml(idea.id)}">✏️ 編輯</button>
      <button type="button" class="btn btn-outline btn-sm manage-delete-btn" data-id="${escapeHtml(idea.id)}" style="color:var(--color-danger);border-color:#ffc7ca;">🗑️ 刪除</button>
    </div>` : ''}
  `;
  openModal('detailModal');
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('open');
  }
});
</script>
<script>
// 資料存取層（正式共用版）：透過 google.script.run 呼叫 Code.gs 裡的伺服器函式，
// 不需要 fetch()，也就不會遇到「網域限定存取」造成的登入導向問題。

function callServer(fnName, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (err) { reject(err); })
      [fnName](payload);
  });
}

async function fetchActivities() {
  const result = await callServer('getActivitiesForClient');
  return Array.isArray(result) ? result : [];
}

async function submitActivity(data) {
  return callServer('addActivityForClient', data);
}

// ---------- 我有 H5 活動靈感 ----------
async function fetchIdeas() {
  const result = await callServer('getIdeasForClient');
  return Array.isArray(result) ? result : [];
}
async function submitIdea(data) { return callServer('addIdeaForClient', data); }
async function updateIdea(id, data) { return callServer('updateIdeaForClient', Object.assign({ id: id }, data)); }
async function deleteIdea(id) { return callServer('deleteIdeaForClient', id); }

async function updateHotIdea(id, data) { return callServer('updateHotIdeaForClient', Object.assign({ id: id }, data)); }
async function deleteHotIdea(id) { return callServer('deleteHotIdeaForClient', id); }
</script>
